<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Connects to your main dark theme CSS -->
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <!-- Wraps everything in a centered box -->
    <div class="login-container">
        
        <h1>Welcome Back</h1>
        <p>Please log in to continue.</p>

        <!-- The Form -->
        <form action="home.html">
            <div class="input-group">
                <label for="user-email">Email</label>
                <!-- type="email" ensures the phone keyboard shows the '@' symbol -->
                <input type="email" id="user-email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="user-password">Password</label>
                <!-- type="password" hides the text as dots -->
                <input type="password" id="user-password" placeholder="Enter your password" required>
            </div>

            <!-- Reusing your my-button class for consistency -->
            <button type="submit" class="my-button submit-btn">Log In</button>
        </form>

        <div class="login-links">
            <a href="home.html">Forgot password?</a><br>
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>

        <!-- Just in case they want to skip for now -->
        <a href="home.html" class="my-button skip-btn">Skip to Home</a>
        
    </div>

</body>
</html>
